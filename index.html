<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#101820">
  <title>Ліхтарник — запали ніч</title>
  <link rel="stylesheet" href="style.css?v0.1">
  <link rel="stylesheet" href="home.css?v0.1">
  <link rel="stylesheet" href="blocks.css?v0.1">
  <link rel="stylesheet" href="game.css?v0.1">
</head>
<body>
  <header>
    <a class="brand" href="./"><span class="brand-icon">✧</span> ліхтарник</a>
    <span class="header-note">МАЛЕНЬКІ КРОКИ. ТЕПЛЕ СВІТЛО.</span>
    <div class="header-audio">
      <button id="reset-progress" class="quiet btn-reset-progress" aria-label="Скинути прогрес гри" title="Скинути весь прогрес проходження гри">↺ Скинути прогрес</button>
      <button id="theme" class="quiet" aria-label="Тема оформлення">🌙 Тема: Ніч</button>
      <div id="site-zoom-control" class="site-zoom-control header-zoom-control" role="group" aria-label="Масштаб усього сайту" title="Масштаб сайту">
        <button type="button" id="site-zoom-out" class="site-zoom-btn" aria-label="Зменшити масштаб сайту" title="Зменшити масштаб сайту (−10%)">−</button>
        <span id="site-zoom-val" class="site-zoom-val" title="Клікніть, щоб скинути до 100%">100%</span>
        <button type="button" id="site-zoom-in" class="site-zoom-btn" aria-label="Збільшити масштаб сайту" title="Збільшити масштаб сайту (+10%)">+</button>
        <button type="button" id="site-zoom-reset" class="site-zoom-reset" aria-label="Скинути масштаб" title="Скинути масштаб до 100%" style="display:none">↺</button>
      </div>
      <button id="sound" class="quiet" aria-pressed="true">🔊 Звуки: увімк.</button>
      <button id="music" class="quiet" aria-pressed="true">♫ Музика: увімк.</button>
      <button id="fullscreen" class="quiet" aria-label="Повний екран" title="Увімкнути повний екран">⛶ Повний екран</button>
    </div>
  </header>

  <main id="app">
    <p class="loading">Запалюємо зорі…</p>
  </main>

  <footer>Ніч чекає на твою програму.</footer>
  <script type="module" src="app.js?v0.1"></script>
</body>
</html>
